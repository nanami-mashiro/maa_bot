[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maa-tg-bot"
version = "0.1.0"
description = "Telegram bot service for controlling maa-cli on a server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.6,<23",
]

[project.scripts]
maa-tg-bot = "maa_tg_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maa_tg_bot*"]

[tool.ruff]
line-length = 100
target-version = "py311"
