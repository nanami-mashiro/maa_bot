services:
  redroid:
    # 本地 x86_64 部署使用 redroid 11 + libndk ARM 转译镜像
    # （由 ayasa520/redroid-script 生成：python redroid.py -a 11.0.0 -n）。
    # 明日方舟官服 APK 只有 arm64-v8a/armeabi-v7a，x86 上必须走 native bridge。
    image: redroid/redroid:11.0.0_ndk
    privileged: true
    restart: unless-stopped
    ports:
      # ADB 无鉴权,只绑宿主回环(scrcpy/adb 本机直连用),勿暴露局域网。
      - "127.0.0.1:5555:5555"
    volumes:
      - redroid-data:/data
    command:
      - androidboot.redroid_width=1280
      - androidboot.redroid_height=720
      - androidboot.redroid_dpi=240
      # 无 ashmem 的新内核(5.18+)使用 memfd 替代。
      - androidboot.use_memfd=true
      # Docker Desktop/WSL2 容器内无 GPU 设备，显式使用软件渲染。
      - androidboot.redroid_gpu_mode=guest
      # libndk ARM 转译（redroid-script README 中 11.0.0 的推荐参数）。
      - ro.product.cpu.abilist=x86_64,arm64-v8a,x86,armeabi-v7a,armeabi
      - ro.product.cpu.abilist64=x86_64,arm64-v8a
      - ro.product.cpu.abilist32=x86,armeabi-v7a,armeabi
      - ro.dalvik.vm.isa.arm=x86
      - ro.dalvik.vm.isa.arm64=x86_64
      - ro.enable.native.bridge.exec=1
      - ro.vendor.enable.native.bridge.exec=1
      - ro.vendor.enable.native.bridge.exec64=1
      - ro.dalvik.vm.native.bridge=libndk_translation.so
      - ro.ndk_translation.version=0.2.3

  maa-bot:
    build: .
    # Docker Desktop (WSL2) 上 host 网络指向的是 VM 而非 Windows 宿主机，
    # 因此这里使用默认 compose 网络，通过服务名 redroid 直连 ADB。
    restart: unless-stopped
    depends_on:
      - redroid
    environment:
      MAA_TG_CONFIG: /app/config/bot.toml
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?set TELEGRAM_ALLOWED_USER_IDS in .env}
      TZ: ${TZ:-Asia/Shanghai}
      # 默认不走代理（美国等可直连 Telegram 的环境留空即可）。
      # 如需代理（例如中国大陆），在 .env 中设置 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY。
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      ADB_CONNECT_HOST: redroid:5555
      ADB_SERIAL: redroid:5555
      ARKNIGHTS_LOGIN_ENABLED: ${ARKNIGHTS_LOGIN_ENABLED:-}
      ARKNIGHTS_LOGIN_USERNAME: ${ARKNIGHTS_LOGIN_USERNAME:-}
      ARKNIGHTS_LOGIN_PASSWORD: ${ARKNIGHTS_LOGIN_PASSWORD:-}
      MAA_STARTUP_RETRIES: ${MAA_STARTUP_RETRIES:-}
      CLIENT_UPDATE_ENABLED: ${CLIENT_UPDATE_ENABLED:-}
      CLIENT_UPDATE_DOWNLOAD_URL: ${CLIENT_UPDATE_DOWNLOAD_URL:-}
      CLIENT_UPDATE_DOWNLOAD_TIMEOUT_SECONDS: ${CLIENT_UPDATE_DOWNLOAD_TIMEOUT_SECONDS:-}
      CLIENT_UPDATE_INSTALL_TIMEOUT_SECONDS: ${CLIENT_UPDATE_INSTALL_TIMEOUT_SECONDS:-}
      MAA_CORE_UPDATE_ENABLED: ${MAA_CORE_UPDATE_ENABLED:-true}
      MAA_CORE_UPDATE_CHANNEL: ${MAA_CORE_UPDATE_CHANNEL:-stable}
      MAA_CORE_UPDATE_INTERVAL_SECONDS: ${MAA_CORE_UPDATE_INTERVAL_SECONDS:-21600}
      MAA_CORE_UPDATE_TIMEOUT_SECONDS: ${MAA_CORE_UPDATE_TIMEOUT_SECONDS:-1800}
      MAA_CORE_UPDATE_TEST_TIME: ${MAA_CORE_UPDATE_TEST_TIME:-0}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-}
      SCHEDULE_DAILY_TIMES: ${SCHEDULE_DAILY_TIMES:-}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-}
      SCHEDULE_NOTIFY_CHAT_ID: ${SCHEDULE_NOTIFY_CHAT_ID:-}
      MAA_CONFIG_DIR: /data/maa-config
      BOT_LOG_DIR: /data/logs
    volumes:
      - ./maa_tg_bot:/app/maa_tg_bot:ro
      - ./config:/app/config:ro
      # 时区由镜像内 tzdata + entrypoint 按 $TZ 设置，
      # Docker Desktop 的 VM 里没有 /usr/share/zoneinfo 可供挂载。
      - maa-data:/root/.local/share/maa
      - maa-config:/data/maa-config
      - bot-logs:/data/logs

volumes:
  redroid-data:
  maa-data:
  maa-config:
  bot-logs:
